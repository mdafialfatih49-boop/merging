name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract mod ZIP
        run: unzip -q mergepistons-mod.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Build mod
        run: gradle build
        working-directory: mergepistons-mod

      - uses: actions/upload-artifact@v4
        with:
          name: MergePistons-Fabric-1.20.1
          path: mergepistons-mod/build/libs/*.jar
